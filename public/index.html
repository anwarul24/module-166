<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Ledger – Personal Expense Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <h1>Pocket Ledger</h1>
      <p>Track what comes in and what goes out.</p>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <!-- Dashboard -->
    <section class="dash" aria-label="Dashboard">
      <div class="balance">
        <span class="label">Current balance</span>
        <strong id="balance" class="balance-amount">$0.00</strong>
        <div class="split" aria-hidden="true">
          <span id="splitIncome" class="split-in"></span>
          <span id="splitExpense" class="split-out"></span>
        </div>
      </div>
      <div class="stat stat-in">
        <span class="label">Total income</span>
        <strong id="totalIncome">$0.00</strong>
      </div>
      <div class="stat stat-out">
        <span class="label">Total expenses</span>
        <strong id="totalExpense">$0.00</strong>
      </div>
    </section>

    <div class="grid">
      <!-- Add / Edit transaction -->
      <section class="panel" aria-labelledby="formTitle">
        <h2 id="formTitle">Add transaction</h2>
        <form id="form" novalidate>
          <div class="field">
            <label for="title">Transaction title</label>
            <input id="title" name="title" type="text" maxlength="100" placeholder="e.g. Lunch with Sam" autocomplete="off">
            <p class="error" data-error="title"></p>
          </div>

          <div class="field">
            <label for="amount">Amount</label>
            <input id="amount" name="amount" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00">
            <p class="error" data-error="amount"></p>
          </div>

          <fieldset class="field">
            <legend>Transaction type</legend>
            <div class="seg">
              <input type="radio" name="type" id="typeExpense" value="expense" checked>
              <label for="typeExpense">Expense</label>
              <input type="radio" name="type" id="typeIncome" value="income">
              <label for="typeIncome">Income</label>
            </div>
            <p class="error" data-error="type"></p>
          </fieldset>

          <div class="row">
            <div class="field">
              <label for="category">Category</label>
              <select id="category" name="category"></select>
              <p class="error" data-error="category"></p>
            </div>
            <div class="field">
              <label for="date">Date</label>
              <input id="date" name="date" type="date">
              <p class="error" data-error="date"></p>
            </div>
          </div>

          <div class="actions">
            <button type="submit" id="submitBtn" class="btn btn-primary">Add transaction</button>
            <button type="button" id="cancelEdit" class="btn btn-ghost" hidden>Cancel</button>
          </div>
        </form>
      </section>

      <!-- History -->
      <section class="panel" aria-labelledby="historyTitle">
        <div class="history-head">
          <h2 id="historyTitle">Transaction history</h2>
          <div class="tools">
            <input id="search" type="search" placeholder="Search by title" aria-label="Search transactions by title">
            <div class="tabs" role="group" aria-label="Filter transactions">
              <button type="button" class="tab is-active" data-filter="all">All</button>
              <button type="button" class="tab" data-filter="income">Income</button>
              <button type="button" class="tab" data-filter="expense">Expenses</button>
            </div>
          </div>
        </div>

        <div id="empty" class="empty" hidden></div>

        <table id="table">
          <thead>
            <tr><th>Title</th><th>Category</th><th>Type</th><th>Date</th><th class="num">Amount</th><th><span class="sr">Actions</span></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </section>
    </div>

    <!-- Monthly summary -->
    <section class="panel monthly" aria-labelledby="monthlyTitle">
      <h2 id="monthlyTitle">Monthly summary</h2>
      <div id="monthly"></div>
    </section>
  </div>

  <dialog id="confirm">
    <form method="dialog">
      <h3>Delete this transaction?</h3>
      <p id="confirmText"></p>
      <div class="actions">
        <button value="cancel" class="btn btn-ghost">Keep it</button>
        <button value="ok" id="confirmOk" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
